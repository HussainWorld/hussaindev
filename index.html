<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>HussainDev | Software Engineer Portfolio</title>


    <!-- 🧠 Basic SEO -->
    <meta name="description" content="Building modern websites and mobile apps with React, Vite, and Express." />
    <link rel="canonical" href="https://www.hussaindev.com/" />

    <!-- 🧩 Favicons and Touch Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=10" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=10" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=10" />
    <link rel="icon" type="image/png" href="/favicon.png?v=10" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=10" sizes="180x180" />
    <meta name="apple-mobile-web-app-title" content="HussainDev" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg?v=9" color="#202020" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 🧩 Open Graph (social previews) -->
    <meta property="og:title" content="HussainDev | Software Engineer Portfolio" />
    <meta property="og:description" content="Building modern websites and mobile apps with React, Vite, and Express." />
    <meta property="og:image" content="https://www.hussaindev.com/preview.png" />
    <meta property="og:url" content="https://www.hussaindev.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HussainDev" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HussainDev | Software Engineer Portfolio" />
    <meta name="twitter:description" content="Building modern websites and mobile apps with React, Vite, and Express." />
    <meta name="twitter:image" content="https://www.hussaindev.com/preview.png" />

    <!-- Hint browsers your site supports dark/light -->
    <meta name="color-scheme" content="dark light" />

    <!-- Browser chrome matches the app surface; kept in sync by useTheme -->
    <meta name="theme-color" content="#131316" />

    <!-- 🧱 Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- 🎨 Theme flash prevention — also sets theme-color before first paint.
         iOS Safari paints the status bar and toolbar from theme-color and reads
         it at parse time, so leaving it to React means white bars above and
         below a dark app. -->
    <script>
      (function(){
        var t=localStorage.getItem('theme-preference');if(t!=='dark'&&t!=='light')t='dark';
        document.documentElement.setAttribute('data-theme',t);
        var m=document.querySelector('meta[name="theme-color"]');
        if(m)m.setAttribute('content',t==='dark'?'#131316':'#ffffff');
      })();
    </script>

    <!-- 🎨 Base styles -->
    <style>
      body {
        margin: 0;
        background-color: #131316;
        color: #e0e0e0;
        font-family: "Inter", sans-serif;
      }
      [data-theme="light"] body {
        background-color: #ffffff;
        color: #213547;
      }
      [data-theme="dark"] body {
        background-color: #0f0f0f;
        color: #e0e0e0;
      }
      /* Phones run the app full-screen: no page scroll, no text auto-sizing. */
      @media (max-width: 900px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
          overscroll-behavior: none;
          -webkit-text-size-adjust: 100%;
        }
        [data-theme="dark"] body {
          background-color: #131316;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
